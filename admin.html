<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — IUBAT Agriculture Alumni Network</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<meta name="robots" content="noindex, nofollow" />
</head>
<body data-auth="admin">

<div id="navbar-root"></div>

<header class="section" style="padding-bottom:0;">
  <div class="container">
    <p class="eyebrow">Admin</p>
    <h1>Review Queue</h1>
    <p class="muted">Approve or reject alumni registrations. This page is never linked publicly — access is enforced by the <code>admins</code> allow-list in the Firestore rules, not by hiding the URL.</p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="row" style="gap:12px; margin-bottom:24px;">
      <button class="btn btn-outline btn-sm filter-btn active" data-status="pending">Pending</button>
      <button class="btn btn-outline btn-sm filter-btn" data-status="approved">Approved</button>
      <button class="btn btn-outline btn-sm filter-btn" data-status="rejected">Rejected</button>
    </div>
    <div id="queueList"><p class="muted"><span class="spinner"></span> Loading…</p></div>
  </div>
</section>

<!-- EmailJS: sends the approval-notification email. Replace YOUR_PUBLIC_KEY
     with your own key from the EmailJS dashboard (Account → API Keys). -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>emailjs.init("led7de4ijLLGq675b");</script>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/navbar-loader.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
